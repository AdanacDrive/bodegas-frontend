<div class="container py-4">
  <h1 class="mb-4">Bodegas</h1>

  <div class="row">
    <div class="col-md-4 mb-4">
      <app-bodega-form (registrada)="cargar()" />
    </div>
    <div class="col-md-8">
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }
      <app-producto-tabla [bodegas]="bodegas()" />
    </div>
  </div>
</div>
