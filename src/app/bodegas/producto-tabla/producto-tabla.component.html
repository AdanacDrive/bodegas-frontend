<h5>Productos</h5>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Producto</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Bodega</th>
    </tr>
  </thead>
  <tbody>
    @for (b of bodegas; track b.id) {
      @for (p of b.productos; track p.id) {
        <tr>
          <td>{{ p.nombre }}</td>
          <td>{{ p.precio | number:'1.0-0' }}</td>
          <td>{{ p.cantidad }}</td>
          <td>{{ b.nombre }}</td>
        </tr>
      }
    }
  </tbody>
</table>
